[project]
name = "examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fused-bilagrid",
    "fused-ssim",
    "imageio[ffmpeg]>=2.38.1",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.2",
    "nerfview",
    "numpy>=2.0,<3.0",
    "opencv-python-headless>=5.0.0.93",
    "piexif>=1.1.3",
    "pillow>=13.0.0",
    "ppisp",
    "pycolmap>=3.10.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "splines>=0.3.3",
    "tensorboard>=2.21.0",
    "tensorly>=0.10.0",
    "torchmetrics==1.8.2",
    "tqdm>=4.70.1",
    "tyro>=0.8.8,!=1.0.9,!=1.0.10",
    "viser>=1.1.1",
]

[tool.uv.sources]
ppisp = { git = "https://github.com/nv-tlabs/ppisp", rev = "v1.2.1" }
nerfview = { git = "https://github.com/nerfstudio-project/nerfview", rev = "4538024fe0d15fd1a0e4d760f3695fc44ca72787" }
